[package]
name = "miniloader"
version = "0.1.0"
edition = "2021"
rust-version = "1.60"
license = "MPL-2.0"
description = "Pure logic core of a minimal guest ELF loader (stage two)"

[lib]
name = "miniloader"
path = "src/lib.rs"

[[bin]]
name = "miniloader-plan"
path = "src/main.rs"

[dependencies]
# Only for the host-side executor tests: mmap/mprotect/munmap. Pinned to a release
# that still builds with the declared 1.60 MSRV.
libc = "=0.2.126"
