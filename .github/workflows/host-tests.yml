name: Host regression tests

on:
  push:
    paths:
      - 'app/src/main/java/io/twoyi/**'
      - 'app/rs/src/**'
      - 'tools/**'
      - '.github/workflows/host-tests.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure-java-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile every Android-free main class together
        run: |
          mkdir -p "$RUNNER_TEMP/pure-java"
          javac -Xlint:all -encoding UTF-8 -d "$RUNNER_TEMP/pure-java" \
            app/src/main/java/io/twoyi/GuestEndpoints.java \
            app/src/main/java/io/twoyi/GuestSlot.java \
            app/src/main/java/io/twoyi/GuestSlotLayout.java \
            app/src/main/java/io/twoyi/GuestSlotSelection.java \
            app/src/main/java/io/twoyi/GuestInstanceRegistry.java \
            app/src/main/java/io/twoyi/GuestInstanceGate.java \
            app/src/main/java/io/twoyi/GuestInstanceManager.java \
            app/src/main/java/io/twoyi/GuestStartupSlot.java \
            app/src/main/java/io/twoyi/ControlSocketRetry.java \
            app/src/main/java/io/twoyi/TwinProviderRules.java \
            app/src/main/java/io/twoyi/TwinModelCatalog.java \
            app/src/main/java/io/twoyi/TwinSecretFormat.java \
            app/src/main/java/io/twoyi/TwinTaskState.java \
            app/src/main/java/io/twoyi/GuestRomPreflight.java \
            app/src/main/java/io/twoyi/GuestPreflightNote.java \
            app/src/main/java/io/twoyi/HalConnectionRegistry.java \
            app/src/main/java/io/twoyi/WindowOwner.java \
            app/src/main/java/io/twoyi/utils/RomInstallTransaction.java \
            app/src/main/java/io/twoyi/utils/RomArchiveBudget.java \
            app/src/main/java/io/twoyi/utils/GuestMaintenance.java \
            app/src/main/java/io/twoyi/utils/GuestDataWipe.java \
            app/src/main/java/io/twoyi/utils/ApkCopyBudget.java \
            app/src/main/java/io/twoyi/utils/DiagnosticArchiveBudget.java \
            app/src/main/java/io/twoyi/utils/AndroidPropertyFile.java

  diagnostic-archive-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Check diagnostic archive byte limits
        run: |
          mkdir -p "$RUNNER_TEMP/diagnostic-budget"
          javac -d "$RUNNER_TEMP/diagnostic-budget" app/src/main/java/io/twoyi/utils/DiagnosticArchiveBudget.java tools/DiagnosticArchiveBudgetTest.java
          java -cp "$RUNNER_TEMP/diagnostic-budget" io.twoyi.utils.DiagnosticArchiveBudgetTest

  apk-copy-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Check shared temporary APK storage budget
        run: |
          mkdir -p "$RUNNER_TEMP/apk-budget"
          javac -d "$RUNNER_TEMP/apk-budget" app/src/main/java/io/twoyi/utils/ApkCopyBudget.java tools/ApkCopyBudgetTest.java
          java -cp "$RUNNER_TEMP/apk-budget" io.twoyi.utils.ApkCopyBudgetTest

  boot-state:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    env:
      # Every slot-dependent regression compiles this same set, so a new
      # dependency shows up once instead of per step.
      SLOT_SOURCES: >-
        app/src/main/java/io/twoyi/GuestEndpoints.java
        app/src/main/java/io/twoyi/GuestSlot.java
        app/src/main/java/io/twoyi/GuestSlotLayout.java
        app/src/main/java/io/twoyi/GuestSlotSelection.java
        app/src/main/java/io/twoyi/GuestInstanceRegistry.java
        app/src/main/java/io/twoyi/GuestInstanceGate.java
        app/src/main/java/io/twoyi/GuestInstanceManager.java
        app/src/main/java/io/twoyi/GuestStartupSlot.java
        app/src/main/java/io/twoyi/ControlSocketRetry.java
        app/src/main/java/io/twoyi/utils/GuestDataWipe.java
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Report runner architecture
        run: |
          uname -m
          echo "runner=${{ matrix.os }}"
      - name: Test actual boot state class with Android API stubs
        run: python3 tools/test_boot_state.py
      - name: Verify ROM preflight rejects incomplete or oversized archives
        run: |
          mkdir -p "$RUNNER_TEMP/rom-tests"
          javac -d "$RUNNER_TEMP/rom-tests" app/src/main/java/io/twoyi/utils/RomArchiveBudget.java tools/RomArchiveBudgetTest.java
          java -cp "$RUNNER_TEMP/rom-tests" io.twoyi.utils.RomArchiveBudgetTest
      - name: Check vendor property preservation
        run: |
          mkdir -p "$RUNNER_TEMP/rom-properties"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/rom-properties" app/src/main/java/io/twoyi/utils/AndroidPropertyFile.java tools/AndroidPropertyFileTest.java
          java -cp "$RUNNER_TEMP/rom-properties" io.twoyi.utils.AndroidPropertyFileTest
      - name: Verify interrupted ROM installation recovery
        run: |
          mkdir -p "$RUNNER_TEMP/rom-transaction"
          javac -d "$RUNNER_TEMP/rom-transaction" app/src/main/java/io/twoyi/utils/RomInstallTransaction.java tools/RomInstallTransactionTest.java
          java -cp "$RUNNER_TEMP/rom-transaction" io.twoyi.utils.RomInstallTransactionTest
      - name: Verify APK installation and shutdown are mutually exclusive
        run: |
          mkdir -p "$RUNNER_TEMP/maintenance-tests"
          javac -d "$RUNNER_TEMP/maintenance-tests" app/src/main/java/io/twoyi/utils/GuestMaintenance.java tools/GuestMaintenanceTest.java
          java -cp "$RUNNER_TEMP/maintenance-tests" io.twoyi.utils.GuestMaintenanceTest
      - name: Test window replacement callback ordering
        run: |
          mkdir -p "$RUNNER_TEMP/window-tests"
          javac -d "$RUNNER_TEMP/window-tests" app/src/main/java/io/twoyi/WindowOwner.java tools/WindowOwnerTest.java
          java -cp "$RUNNER_TEMP/window-tests" io.twoyi.WindowOwnerTest
      - name: Verify legacy input paths and descriptor limits
        run: |
          mkdir -p "$RUNNER_TEMP/endpoint-tests"
          javac -d "$RUNNER_TEMP/endpoint-tests" $SLOT_SOURCES tools/GuestEndpointsTest.java
          java -cp "$RUNNER_TEMP/endpoint-tests" io.twoyi.GuestEndpointsTest
      - name: Verify guest slot isolation
        run: |
          mkdir -p "$RUNNER_TEMP/slot-tests"
          javac -d "$RUNNER_TEMP/slot-tests" $SLOT_SOURCES tools/GuestSlotTest.java
          java -cp "$RUNNER_TEMP/slot-tests" io.twoyi.GuestSlotTest
      - name: Verify HAL connection tracking
        run: |
          mkdir -p "$RUNNER_TEMP/hal-conn-tests"
          javac -d "$RUNNER_TEMP/hal-conn-tests" app/src/main/java/io/twoyi/HalConnectionRegistry.java tools/HalConnectionRegistryTest.java
          java -cp "$RUNNER_TEMP/hal-conn-tests" io.twoyi.HalConnectionRegistryTest
      - name: Verify per-slot service class mapping
        run: |
          mkdir -p "$RUNNER_TEMP/service-slot-tests"
          javac -d "$RUNNER_TEMP/service-slot-tests" $SLOT_SOURCES tools/GuestServiceSlotTest.java
          java -cp "$RUNNER_TEMP/service-slot-tests" io.twoyi.GuestServiceSlotTest
      - name: Guard guest paths against data-directory derivation
        run: python3 tools/check_slot_paths.py
      - name: Verify guest preflight record
        run: |
          mkdir -p "$RUNNER_TEMP/preflight-note"
          javac -d "$RUNNER_TEMP/preflight-note" \
            app/src/main/java/io/twoyi/GuestPreflightNote.java \
            tools/GuestPreflightNoteTest.java
          java -cp "$RUNNER_TEMP/preflight-note" io.twoyi.GuestPreflightNoteTest
      - name: Verify guest init preflight
        run: |
          mkdir -p "$RUNNER_TEMP/rom-preflight"
          javac -d "$RUNNER_TEMP/rom-preflight" \
            app/src/main/java/io/twoyi/GuestRomPreflight.java \
            tools/GuestRomPreflightTest.java
          java -cp "$RUNNER_TEMP/rom-preflight" io.twoyi.GuestRomPreflightTest
      - name: Verify twin task state
        run: |
          mkdir -p "$RUNNER_TEMP/task-state"
          javac -d "$RUNNER_TEMP/task-state" \
            app/src/main/java/io/twoyi/TwinTaskState.java \
            tools/TwinTaskStateTest.java
          java -cp "$RUNNER_TEMP/task-state" io.twoyi.TwinTaskStateTest
      - name: Verify provider secret envelope
        run: |
          mkdir -p "$RUNNER_TEMP/secret-format"
          javac -d "$RUNNER_TEMP/secret-format" \
            app/src/main/java/io/twoyi/TwinSecretFormat.java \
            tools/TwinSecretFormatTest.java
          java -cp "$RUNNER_TEMP/secret-format" io.twoyi.TwinSecretFormatTest
      - name: Verify model catalog reading
        run: |
          mkdir -p "$RUNNER_TEMP/model-catalog"
          javac -d "$RUNNER_TEMP/model-catalog" \
            app/src/main/java/io/twoyi/TwinModelCatalog.java \
            tools/TwinModelCatalogTest.java
          java -cp "$RUNNER_TEMP/model-catalog" io.twoyi.TwinModelCatalogTest
      - name: Verify provider form rules
        run: |
          mkdir -p "$RUNNER_TEMP/provider-rules"
          javac -d "$RUNNER_TEMP/provider-rules" \
            app/src/main/java/io/twoyi/TwinProviderRules.java \
            tools/TwinProviderRulesTest.java
          java -cp "$RUNNER_TEMP/provider-rules" io.twoyi.TwinProviderRulesTest
      - name: Verify bounded control socket retries
        run: |
          mkdir -p "$RUNNER_TEMP/control-retry-tests"
          javac -d "$RUNNER_TEMP/control-retry-tests" app/src/main/java/io/twoyi/ControlSocketRetry.java tools/ControlSocketRetryTest.java
          java -cp "$RUNNER_TEMP/control-retry-tests" io.twoyi.ControlSocketRetryTest
      - name: Verify startup slot resolution
        run: |
          mkdir -p "$RUNNER_TEMP/startup-slot-tests"
          javac -d "$RUNNER_TEMP/startup-slot-tests" $SLOT_SOURCES tools/GuestStartupSlotTest.java
          java -cp "$RUNNER_TEMP/startup-slot-tests" io.twoyi.GuestStartupSlotTest
      - name: Verify instance create and release
        run: |
          mkdir -p "$RUNNER_TEMP/instance-manager-tests"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/instance-manager-tests" $SLOT_SOURCES tools/GuestInstanceManagerTest.java
          java -cp "$RUNNER_TEMP/instance-manager-tests" io.twoyi.GuestInstanceManagerTest
      - name: Verify the instance start gate
        run: |
          mkdir -p "$RUNNER_TEMP/instance-gate-tests"
          javac -d "$RUNNER_TEMP/instance-gate-tests" $SLOT_SOURCES tools/GuestInstanceGateTest.java
          java -cp "$RUNNER_TEMP/instance-gate-tests" io.twoyi.GuestInstanceGateTest
      - name: Verify guest instance registry
        run: |
          mkdir -p "$RUNNER_TEMP/instance-registry-tests"
          javac -d "$RUNNER_TEMP/instance-registry-tests" $SLOT_SOURCES tools/GuestInstanceRegistryTest.java
          java -cp "$RUNNER_TEMP/instance-registry-tests" io.twoyi.GuestInstanceRegistryTest
      - name: Verify per-slot guest directory layout
        run: |
          mkdir -p "$RUNNER_TEMP/slot-layout-tests"
          javac -d "$RUNNER_TEMP/slot-layout-tests" $SLOT_SOURCES tools/GuestSlotLayoutTest.java
          java -cp "$RUNNER_TEMP/slot-layout-tests" io.twoyi.GuestSlotLayoutTest
      - name: Verify guest slot selection parsing
        run: |
          mkdir -p "$RUNNER_TEMP/slot-select-tests"
          javac -d "$RUNNER_TEMP/slot-select-tests" $SLOT_SOURCES tools/GuestSlotSelectionTest.java
          java -cp "$RUNNER_TEMP/slot-select-tests" io.twoyi.GuestSlotSelectionTest
      - name: Verify wipe-all-data stays inside the guest data directory
        run: |
          mkdir -p "$RUNNER_TEMP/wipe-tests"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/wipe-tests" app/src/main/java/io/twoyi/utils/GuestDataWipe.java tools/GuestDataWipeTest.java
          java -cp "$RUNNER_TEMP/wipe-tests" io.twoyi.utils.GuestDataWipeTest

  input-stream:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Test input forwarding without Android dependencies
        run: |
          rustc --edition=2021 --test app/rs/src/event_stream.rs -o "$RUNNER_TEMP/event-stream-tests"
          timeout 20 "$RUNNER_TEMP/event-stream-tests"
      - name: Test sparse pointer IDs and cancelled gestures
        run: |
          rustc --edition=2021 --test app/rs/src/touch_slots.rs -o "$RUNNER_TEMP/touch-slot-tests"
          timeout 20 "$RUNNER_TEMP/touch-slot-tests"
      - name: Test touch coordinates across window sizes
        run: |
          rustc --edition=2021 --test app/rs/src/touch_geometry.rs -o "$RUNNER_TEMP/touch-geometry-tests"
          timeout 20 "$RUNNER_TEMP/touch-geometry-tests"
      - name: Verify the legacy ARM64 input event layout
        run: |
          rustc --edition=2021 --test app/rs/src/input_wire.rs -o "$RUNNER_TEMP/input-wire-tests"
          timeout 20 "$RUNNER_TEMP/input-wire-tests"
      - name: Test navigation key mapping and complete event frames
        run: |
          rustc --edition=2021 --test app/rs/src/key_events.rs -o "$RUNNER_TEMP/key-event-tests"
          timeout 20 "$RUNNER_TEMP/key-event-tests"
