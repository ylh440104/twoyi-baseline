name: Minimal loader core

# Stage two of the reconstruction. The modules under tools/miniloader are pure data
# transformations (ELF parsing, mapping plan, initial stack image), so they are
# fully testable on the CI host without a device or an AArch64 target.

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/miniloader/**'
      - '.github/workflows/miniloader.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install a stable Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version
      - name: Format check (advisory)
        # Formatting is not correctness: report the diff but never fail on it.
        continue-on-error: true
        run: |
          set -euo pipefail
          rustup component add rustfmt
          cargo fmt --manifest-path tools/miniloader/Cargo.toml -- --check \
            | tee "$RUNNER_TEMP/rustfmt.diff" || true
          echo "rustfmt suggestions: $(wc -l < "$RUNNER_TEMP/rustfmt.diff") lines"
      - name: Build
        run: cargo build --manifest-path tools/miniloader/Cargo.toml --verbose
      - name: Test
        run: cargo test --manifest-path tools/miniloader/Cargo.toml --verbose
      - name: Clippy
        run: |
          set -euo pipefail
          rustup component add clippy
          cargo clippy --manifest-path tools/miniloader/Cargo.toml -- -D warnings
      - name: Smoke the planner binary
        run: |
          set -euo pipefail
          # Use the test binary itself as input: it is an ELF, just not AArch64,
          # so the expected outcome is a clean rejection with a non-zero exit.
          set +e
          cargo run --manifest-path tools/miniloader/Cargo.toml --bin miniloader-plan -- \
            /bin/ls 4096 > "$RUNNER_TEMP/plan.txt" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/plan.txt"
          if [ "$status" -eq 0 ]; then
            grep -q 'entry: ' "$RUNNER_TEMP/plan.txt"
          else
            grep -q 'NotAarch64' "$RUNNER_TEMP/plan.txt" || {
              echo "::error::the planner failed for an unexpected reason"; exit 1; }
          fi
      - name: Plan a real aarch64 binary
        run: |
          set -euo pipefail
          # A tiny freestanding guest image, so the planner is exercised on a real
          # AArch64 ELF (PT_LOAD segments, an executable entry) rather than only on
          # the synthetic bytes built inside the unit tests.
          sudo apt-get update -q
          sudo apt-get install -y gcc-aarch64-linux-gnu
          work="$RUNNER_TEMP/aarch64"
          mkdir -p "$work"
          cat > "$work/guest.c" <<'EOF'
          void _start(void) {
              volatile unsigned long counter = 0;
              for (;;) {
                  counter++;
              }
          }
          EOF
          aarch64-linux-gnu-gcc -nostdlib -static -O1 -o "$work/guest" "$work/guest.c"
          file "$work/guest"
          aarch64-linux-gnu-readelf -h "$work/guest" | grep -E 'Class|Machine|Entry'
          aarch64-linux-gnu-readelf -l "$work/guest" | grep -E 'LOAD|0x0000' | head -8

          cargo run --manifest-path tools/miniloader/Cargo.toml --bin miniloader-plan -- \
            "$work/guest" 4096 | tee "$RUNNER_TEMP/plan-aarch64.txt"

          grep -q 'entry: 0x' "$RUNNER_TEMP/plan-aarch64.txt"
          grep -q 'entry executable: true' "$RUNNER_TEMP/plan-aarch64.txt"
          grep -q 'seg\[0\]' "$RUNNER_TEMP/plan-aarch64.txt"
          grep -q 'reserve: 0x' "$RUNNER_TEMP/plan-aarch64.txt"
          grep -q 'map 0x' "$RUNNER_TEMP/plan-aarch64.txt"
          grep -q 'initial stack: ' "$RUNNER_TEMP/plan-aarch64.txt"
          # The dry-run image must reproduce the ELF's own entry and copy the bytes.
          grep -q 'image: base=0x' "$RUNNER_TEMP/plan-aarch64.txt"
          grep -qE 'entry_offset=Some\([0-9]+\)' "$RUNNER_TEMP/plan-aarch64.txt"
          # The executable mapping must carry PROT_EXEC (bit 4) plus PROT_READ (bit 1).
          awk '/^map /{ if ($0 ~ /prot=5/ || $0 ~ /prot=7/) found=1 } END{ exit found ? 0 : 1 }' \
            "$RUNNER_TEMP/plan-aarch64.txt"
          echo "planner handled a real aarch64 ELF"

          # Now really map it: mmap the span, copy the segments, mprotect them.
          cargo run --manifest-path tools/miniloader/Cargo.toml --bin miniloader-plan -- \
            "$work/guest" 4096 --map | tee "$RUNNER_TEMP/map-aarch64.txt"
          grep -q 'mapped: entry=0x' "$RUNNER_TEMP/map-aarch64.txt"
          grep -q 'mapped\[0\] addr=0x' "$RUNNER_TEMP/map-aarch64.txt"
          grep -qE 'prot=(5|7)' "$RUNNER_TEMP/map-aarch64.txt"
          grep -q 'entry bytes: ' "$RUNNER_TEMP/map-aarch64.txt"
          grep -q 'relocations: ' "$RUNNER_TEMP/map-aarch64.txt"
          if grep -q 'unreadable' "$RUNNER_TEMP/map-aarch64.txt"; then
            echo "::error::the mapped entry could not be read back"
            exit 1
          fi
          echo "mapped a real aarch64 image into this process"

          # A dynamically linked guest imports symbols; the bridge must report which
          # of them this host can serve and which it cannot.
          cat > "$work/dyn.c" <<'EOF'
          #include <stdio.h>
          #include <stdlib.h>
          int main(void) {
              char *buffer = malloc(64);
              if (buffer == NULL) return 1;
              snprintf(buffer, 64, "%d", 42);
              puts(buffer);
              free(buffer);
              return 0;
          }
          EOF
          aarch64-linux-gnu-gcc -O1 -o "$work/dyn" "$work/dyn.c"
          aarch64-linux-gnu-readelf -d "$work/dyn" | grep -E 'NEEDED|PLTGOT' || true
          cargo run --manifest-path tools/miniloader/Cargo.toml --bin miniloader-plan -- \
            "$work/dyn" 4096 | tee "$RUNNER_TEMP/imports-aarch64.txt"

          grep -qE 'imports: [1-9][0-9]* slot\(s\)' "$RUNNER_TEMP/imports-aarch64.txt"
          grep -q 'imports servable: ' "$RUNNER_TEMP/imports-aarch64.txt"
          # These live in every C runtime, so the bridge must have found them.
          for symbol in malloc free puts; do
            grep -q "imports servable: .*\b$symbol\b" "$RUNNER_TEMP/imports-aarch64.txt" || {
              echo "::error::the bridge did not resolve $symbol from this host"
              exit 1
            }
          done
          echo "bridge reported the aarch64 imports"

          # The preflight verdict: the static binary must be loadable, the dynamic one
          # must be blocked only if a strong import is missing (weak ones are fine).
          cargo run --manifest-path tools/miniloader/Cargo.toml --bin miniloader-plan -- \
            "$work/guest" 4096 --check | tee "$RUNNER_TEMP/check-static.txt"
          grep -q 'check: loadable' "$RUNNER_TEMP/check-static.txt"

          set +e
          cargo run --manifest-path tools/miniloader/Cargo.toml --bin miniloader-plan -- \
            "$work/dyn" 4096 --check > "$RUNNER_TEMP/check-dyn.txt" 2>&1
          dyn_status=$?
          set -e
          cat "$RUNNER_TEMP/check-dyn.txt"
          grep -qE 'check: (loadable|blocked)' "$RUNNER_TEMP/check-dyn.txt"
          grep -q 'check: segments=' "$RUNNER_TEMP/check-dyn.txt"
          if grep -q 'check: blocked' "$RUNNER_TEMP/check-dyn.txt"; then
            grep -q 'check blocker:' "$RUNNER_TEMP/check-dyn.txt"
            echo "preflight blocked the dynamic guest (status $dyn_status) with a reason"
          else
            echo "preflight reported the dynamic guest as loadable"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: miniloader-logs
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/plan.txt
            ${{ runner.temp }}/plan-aarch64.txt
            ${{ runner.temp }}/map-aarch64.txt
            ${{ runner.temp }}/imports-aarch64.txt
            ${{ runner.temp }}/check-static.txt
            ${{ runner.temp }}/check-dyn.txt
            ${{ runner.temp }}/rustfmt.diff