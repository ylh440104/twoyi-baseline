name: Minimal loader core

# Stage two of the reconstruction. The modules under tools/miniloader are pure data
# transformations (ELF parsing, mapping plan, initial stack image), so they are
# fully testable on the CI host without a device or an AArch64 target.

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/miniloader/**'
      - '.github/workflows/miniloader.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install a stable Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version
      - name: Format check (advisory)
        # Formatting is not correctness: report the diff but never fail on it.
        continue-on-error: true
        run: |
          set -euo pipefail
          rustup component add rustfmt
          cargo fmt --manifest-path tools/miniloader/Cargo.toml -- --check \
            | tee "$RUNNER_TEMP/rustfmt.diff" || true
          echo "rustfmt suggestions: $(wc -l < "$RUNNER_TEMP/rustfmt.diff") lines"
      - name: Build
        run: cargo build --manifest-path tools/miniloader/Cargo.toml --verbose
      - name: Test
        run: cargo test --manifest-path tools/miniloader/Cargo.toml --verbose
      - name: Clippy
        run: |
          set -euo pipefail
          rustup component add clippy
          cargo clippy --manifest-path tools/miniloader/Cargo.toml -- -D warnings
      - name: Smoke the planner binary
        run: |
          set -euo pipefail
          # Use the test binary itself as input: it is an ELF, just not AArch64,
          # so the expected outcome is a clean rejection with a non-zero exit.
          set +e
          cargo run --manifest-path tools/miniloader/Cargo.toml --bin miniloader-plan -- \
            /bin/ls 4096 > "$RUNNER_TEMP/plan.txt" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/plan.txt"
          if [ "$status" -eq 0 ]; then
            grep -q 'entry: ' "$RUNNER_TEMP/plan.txt"
          else
            grep -q 'NotAarch64' "$RUNNER_TEMP/plan.txt" || {
              echo "::error::the planner failed for an unexpected reason"; exit 1; }
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: miniloader-logs
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/plan.txt
            ${{ runner.temp }}/rustfmt.diff